# ==============================================================================
# X-AI-Radar Configuration (v2.1 Architecture)
# ==============================================================================

project:
  name: "x-ai-radar"
  version: "2.1.0"
  description: "X(Twitter) & Multi-Source 24h AI/Agents Intelligence Radar"

# ------------------------------------------------------------------------------
# 1. Target Topics & Keywords
# ------------------------------------------------------------------------------
topics:
  primary:
    - "AI"
    - "AI Agents"
    - "Autonomous Agents"
    - "LLM"
    - "MCP"
  
  boost_keywords:
    - "Agent"
    - "Agents"
    - "Multi-Agent"
    - "LangChain"
    - "LangGraph"
    - "CrewAI"
    - "AutoGen"
    - "MCP"
    - "Model Context Protocol"
    - "Function Calling"
    - "Tool Calling"
    - "Computer Use"
    - "Browser Subagent"
    - "Context Window"
    - "Reasoning"
    - "Gemini"
    - "Claude"
    - "OpenAI"
    - "DeepSeek"
    - "Qwen"

  exclude_keywords:
    - "airdrop"
    - "giveaway"
    - "whitelist"
    - "presale"
    - "memecoin"
    - "pump"
    - "telegram bot buy"
    - "crypto drop"
    - "transfer"
    - "football"
    - "soccer"
    - "nba"
    - "player's agent"

# ------------------------------------------------------------------------------
# 2. Filtering & Velocity Engine
# ------------------------------------------------------------------------------
filter:
  window_hours: 24             # Lookback window (last 24 hours)
  candidate_pool_size: 40      # Candidates collected per search query
  top_select_count: 10         # Number of top posts to include
  min_views: 10000             # Minimum view count threshold
  min_likes: 50                # Minimum like count threshold
  min_bookmarks: 20            # Minimum bookmark threshold

# ------------------------------------------------------------------------------
# 3. State Memory & Velocity Tracking
# ------------------------------------------------------------------------------
memory:
  enabled: true
  history_file: "data/history.json"
  max_history_days: 7          # Auto-prune records older than 7 days
  velocity_weight_views: 0.2   # Weight for hourly view delta (ΔViews/Δh)
  velocity_weight_bookmarks: 5.0 # Weight for hourly bookmark delta (ΔBookmarks/Δh)

# ------------------------------------------------------------------------------
# 4. Scoring Formula Weights
# ------------------------------------------------------------------------------
scoring:
  weight_views_per_hour: 0.1
  weight_likes: 1.0
  weight_reposts: 2.5
  weight_bookmarks: 3.0
  keyword_bonus: 150.0

# ------------------------------------------------------------------------------
# 5. Browser Subagent & Search Ingestion
# ------------------------------------------------------------------------------
browser:
  cdp_port: 9223
  cdp_host: "127.0.0.1"
  profile_dir: "$HOME/chrome_agent_profile"
  action_mode: "read_only"
  scroll_iterations: 3
  
  # Precision X search queries with advanced operators
  search_queries:
    - "https://x.com/search?q=(AI%20OR%20Agents%20OR%20LLM%20OR%20MCP)%20min_faves%3A50&f=live"
    - "https://x.com/search?q=(LangGraph%20OR%20CrewAI%20OR%20AutoGen%20OR%20BrowserSubagent)%20min_faves%3A30&f=live"
  
  # Include Home timeline feed
  include_home_timeline: true

# ------------------------------------------------------------------------------
# 6. Multi-Platform Adapters
# ------------------------------------------------------------------------------
adapters:
  github_trending:
    enabled: true
    limit: 5
  
  hackernews:
    enabled: true
    limit: 5

# ------------------------------------------------------------------------------
# 7. Notifications & Webhooks (Credentials loaded from .env or config)
# ------------------------------------------------------------------------------
notifications:
  enabled: true
  webhooks:
    slack: ""
    discord: ""
    telegram_bot_token: ""     # Overridden by .env TELEGRAM_BOT_TOKEN
    telegram_chat_id: ""       # Overridden by .env TELEGRAM_CHAT_ID

# ------------------------------------------------------------------------------
# 8. Schedule Setting
# ------------------------------------------------------------------------------
schedule:
  cron: "15 8 * * *"          # Daily at 08:15 KST
  timezone: "Asia/Seoul"
